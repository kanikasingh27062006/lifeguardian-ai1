<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LifeGuardian AI</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

/* ── Layout ── */
#proto-banner{background:linear-gradient(90deg,#1e3a5f,#0f766e);color:#fff;font-size:11px;padding:0 12px;position:fixed;top:0;left:0;right:0;z-index:100;letter-spacing:.02em;line-height:1.4;display:flex;align-items:center;justify-content:center;gap:8px;height:28px;min-height:28px}
#proto-banner.hidden{display:none!important}
#proto-banner-text{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#proto-close{background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:18px;line-height:1;padding:0 6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:3px;transition:color .14s;height:28px;width:28px;touch-action:manipulation}
#proto-close:hover,#proto-close:focus{color:#fff;outline:none}
#lang-bar{background:#0f172a;color:#fff;font-size:12px;display:flex;align-items:center;gap:0;padding:0 16px;position:fixed;top:28px;left:0;right:0;z-index:99;height:36px;border-bottom:1px solid #1e3a5f;transition:top .15s}
#lang-bar.banner-hidden{top:0}
#app{display:flex;padding-top:64px;min-height:100vh;transition:padding-top .15s}
#app.banner-hidden{padding-top:36px}
#sidebar{width:216px;background:#fff;border-right:1px solid #e2e8f0;position:fixed;top:64px;bottom:0;left:0;z-index:50;display:flex;flex-direction:column;padding:12px 10px;overflow-y:auto;flex-shrink:0;transition:top .15s}
#sidebar.banner-hidden{top:36px}
#main{margin-left:216px;flex:1;padding:22px 26px 40px;min-width:0;overflow-x:hidden}
#page-area{max-width:1060px;margin:0 auto}

/* ── Sidebar ── */
.logo-row{display:flex;align-items:center;gap:9px;padding:2px 4px 12px;border-bottom:1px solid #f1f5f9;margin-bottom:7px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#0f172a,#0d9488);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark svg{stroke:#7dd3fc}
.logo-name{font-weight:700;font-size:13px;color:#0f172a;line-height:1.2}
.logo-ver{font-size:9.5px;color:#94a3b8}
.nav-btn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:none;background:none;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;color:#64748b;text-align:left;transition:background .14s,color .14s;white-space:nowrap;overflow:hidden}
.nav-btn:hover{background:#f0f9ff;color:#0ea5e9}
.nav-btn.active{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff}
.nav-btn.active svg{stroke:#7dd3fc!important}
.nav-badge{margin-left:auto;font-size:9px;background:#eff6ff;color:#3b82f6;padding:1px 5px;border-radius:3px;font-weight:700;flex-shrink:0;min-width:18px;text-align:center}
.nav-badge.red{background:#fee2e2;color:#dc2626}
.sidebar-footer{margin-top:auto;padding-top:10px;border-top:1px solid #f1f5f9}
.sys-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;flex-shrink:0}
.sys-status{display:flex;align-items:center;gap:7px;padding:4px 5px;font-size:11px;color:#64748b}

/* ── Cards ── */
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}

/* ── Buttons ── */
.btn{border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:opacity .14s,background .14s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;box-shadow:0 1px 6px rgba(15,23,42,.18)}
.btn-primary:hover{opacity:.88}
.btn-teal{background:linear-gradient(135deg,#0d9488,#14b8a6);color:#fff;box-shadow:0 1px 6px rgba(13,148,136,.2)}
.btn-teal:hover{opacity:.88}
.btn-outline{background:#fff;color:#334155;border:1.5px solid #e2e8f0}
.btn-outline:hover{border-color:#0ea5e9;color:#0ea5e9;background:#f0f9ff}
.btn-danger{background:#fff;color:#dc2626;border:1.5px solid #fecaca}
.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.badge-low{background:#dcfce7;color:#16a34a}
.badge-medium{background:#fef3c7;color:#d97706}
.badge-high{background:#fee2e2;color:#dc2626}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-gray{background:#f1f5f9;color:#64748b}
.badge-model{background:#ede9fe;color:#7c3aed}
.badge-purple{background:#f5f3ff;color:#5b21b6}

/* ── Sliders ── */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;background:#e2e8f0;border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#0f172a,#1e40af);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer}
input[type=range].teal::-webkit-slider-thumb{background:linear-gradient(135deg,#0d9488,#14b8a6)}

/* ── Activity state buttons ── */
.act-btn{flex:1;min-width:60px;border:2px solid #e2e8f0;border-radius:9px;padding:10px 6px;background:#fff;cursor:pointer;transition:all .14s;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:#475569}
.act-btn:hover{border-color:#38bdf8;background:#f0f9ff}
.act-btn.sel{border-color:#0f172a;background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff}
.act-btn.sel svg{stroke:#7dd3fc!important}

/* ── Scenario cards ── */
.sc-card{border:2px solid #e2e8f0;border-radius:10px;padding:12px;cursor:pointer;background:#fff;transition:all .14s;display:flex;align-items:flex-start;gap:9px}
.sc-card:hover{border-color:#38bdf8;background:#f0f9ff}
.sc-card.sel-low{border-color:#22c55e;background:#f0fdf4}
.sc-card.sel-med{border-color:#f59e0b;background:#fffbeb}
.sc-card.sel-high{border-color:#ef4444;background:#fef2f2}
.sc-card.running{opacity:.6;cursor:not-allowed}

/* ── KPI grid ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04);display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.kpi-label{font-size:10.5px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.kpi-val{font-size:22px;font-weight:800;color:#0f172a;line-height:1;word-break:break-word}
.kpi-sub{font-size:11px;color:#94a3b8;margin-top:4px}
.kpi-icon{width:38px;height:38px;min-width:38px;border-radius:10px;display:flex;align-items:center;justify-content:center}

/* ── Charts ── */
.bar-wrap{display:flex;align-items:flex-end;gap:2px;width:100%}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bar-fill{width:100%;border-radius:2px 2px 0 0;min-height:2px;transition:height .4s}
.bar-label{font-size:8.5px;color:#94a3b8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
.timeline{display:flex;align-items:flex-end;gap:2px;height:56px;width:100%}
.tl-bar{flex:1;border-radius:2px 2px 0 0;min-height:2px;transition:height .3s,background .3s}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:6px 10px;font-size:10px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #f1f5f9}
td{padding:8px 10px;border-bottom:1px solid #f8fafc;color:#334155;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}

/* ── Status animations ── */
@keyframes glowG{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.3)}50%{box-shadow:0 0 0 7px rgba(34,197,94,0)}}
@keyframes glowA{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.3)}50%{box-shadow:0 0 0 7px rgba(245,158,11,0)}}
@keyframes glowR{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 9px rgba(239,68,68,0)}}
@keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:.3;transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes stepIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.glow-g{animation:glowG 2s ease-in-out infinite}
.glow-a{animation:glowA 1.5s ease-in-out infinite}
.glow-r{animation:glowR 1s ease-in-out infinite}
.pulse-ring{animation:pulse 2s ease-in-out infinite}
.spin{animation:spin .8s linear infinite}
.step-in{animation:stepIn .3s ease-out both}

/* ── Page animation ── */
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-in{animation:pageIn .2s ease-out}

/* ── Toast ── */
#toast{position:fixed;bottom:20px;right:20px;z-index:9999;background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:11px 15px;box-shadow:0 8px 28px rgba(0,0,0,.11);display:none;align-items:center;gap:8px;font-size:12.5px;max-width:340px}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.toast-show{display:flex!important;animation:toastIn .22s ease-out}

/* ── Hero ── */
.hero{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 55%,#0f766e 100%);border-radius:14px;padding:24px;color:#fff;position:relative;overflow:hidden;margin-bottom:20px}
.hero::before{content:'';position:absolute;top:-30px;right:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.03);pointer-events:none}

/* ── Grid ── */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.flex-row{display:flex;align-items:center;gap:9px}
.flex-col{display:flex;flex-direction:column;gap:11px}

/* ── Section header ── */
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.sec-icon{width:36px;height:36px;min-width:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.sec-title{font-size:17px;font-weight:700;color:#0f172a}
.sec-sub{font-size:12.5px;color:#64748b;margin-top:1px}

/* ── Form labels ── */
.field-label{font-size:12.5px;font-weight:600;color:#0f172a;margin-bottom:3px}
.field-hint{font-size:11px;color:#94a3b8;margin-bottom:8px;line-height:1.5}
.field-val{background:#f1f5f9;color:#0f172a;border-radius:5px;padding:1px 9px;font-size:13px;font-weight:700;display:inline-block;white-space:nowrap}

/* ── Metric boxes ── */
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:12px 14px;text-align:center}
.metric-num{font-size:24px;font-weight:800;color:#0f172a;line-height:1}
.metric-lbl{font-size:10.5px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}

/* ── Confusion matrix ── */
.cm-table{border-collapse:collapse;font-size:12px;width:100%}
.cm-table th{background:#f8fafc;padding:6px 10px;text-align:center;font-weight:700;color:#475569;border:1px solid #e2e8f0}
.cm-table td{padding:7px 10px;text-align:center;border:1px solid #e2e8f0;font-weight:600}
.cm-diagonal{background:#dcfce7;color:#166534}

/* ── Prob bars ── */
.prob-bar-track{background:#f1f5f9;border-radius:3px;height:8px;flex:1}
.prob-bar-fill{height:100%;border-radius:3px;transition:width .5s ease}

/* ── AI response ── */
.resp-card{border-radius:11px;padding:16px}
.resp-head{font-size:15px;font-weight:700;margin-bottom:8px;line-height:1.35}
.resp-body{font-size:13px;color:#334155;line-height:1.65;margin-bottom:12px}
.resp-sug{font-size:12.5px;color:#0f172a;line-height:1.6;padding:10px 12px;border-radius:8px;background:#f8fafc;border-left:3px solid #0d9488}
.factor-item{font-size:12px;color:#475569;padding:3px 0;display:flex;align-items:flex-start;gap:6px;line-height:1.5}

/* ── Disclaimer ── */
.disclaimer-box{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;font-size:11.5px;color:#92400e;line-height:1.55}
.sim-notice{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px 12px;font-size:11.5px;color:#166534;display:flex;align-items:center;gap:7px}

/* ── Model source badge ── */
.model-source{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 7px;border-radius:99px;font-weight:600}
.model-source.ml{background:#ede9fe;color:#5b21b6}
.model-source.heuristic{background:#f1f5f9;color:#64748b}

/* ── Notification items ── */
.notif-item{border-radius:10px;padding:12px 14px;border:1px solid #e2e8f0;background:#fff;transition:background .14s;position:relative}
.notif-item.unread{background:#f8faff;border-color:#bfdbfe}
.notif-item.risk-high{border-left:3px solid #ef4444}
.notif-item.risk-medium{border-left:3px solid #f59e0b}
.notif-item.risk-low{border-left:3px solid #22c55e}

/* ── Step list ── */
.step-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f8fafc}
.step-row:last-child{border-bottom:none}
.step-num{width:22px;height:22px;min-width:22px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#475569}
.step-num.done{background:#dcfce7;color:#166534}
.step-num.active{background:#dbeafe;color:#1d4ed8}

/* ── Q-table ── */
.qtable{border-collapse:collapse;width:100%;font-size:11.5px}
.qtable th{background:#f8fafc;padding:5px 8px;border:1px solid #e2e8f0;font-weight:700;color:#475569;text-align:center;font-size:10.5px}
.qtable td{padding:5px 8px;border:1px solid #e2e8f0;text-align:center}
.qtable .best-action{background:#dcfce7;font-weight:800;color:#166534}
.qtable .state-cell{text-align:left;font-weight:600;color:#0f172a}

/* ── Reward chart ── */
.reward-chart{height:120px;display:flex;align-items:flex-end;gap:1px}
.reward-bar{flex:1;border-radius:2px 2px 0 0;min-height:2px;transition:height .4s}

/* ── Select ── */
select{border:1.5px solid #e2e8f0;border-radius:7px;padding:6px 10px;font-size:12.5px;background:#fff;color:#334155;cursor:pointer;outline:none}
select:focus{border-color:#0ea5e9}

/* ── Lang bar ── */
.lang-btn{background:none;border:none;color:rgba(255,255,255,.55);font-size:12px;font-weight:500;cursor:pointer;padding:4px 10px;border-radius:5px;transition:all .14s;white-space:nowrap}
.lang-btn:hover{color:#fff;background:rgba(255,255,255,.1)}
.lang-btn.active{color:#7dd3fc;font-weight:700;background:rgba(255,255,255,.08)}
.lang-sep{color:rgba(255,255,255,.2);padding:0 4px;font-size:11px}

/* ── Hindi ── */
.lang-hi{font-size:13.5px;line-height:1.7}
.lang-hi .kpi-val{font-size:18px}
.lang-hi .nav-btn{font-size:12px}

/* ── Mobile ── */
/* Pixel math: banner=28px, lang-bar=32px, mob-topbar=42px */
/* With banner:    lang-bar top=28, mob-topbar top=60, main pt=28+32+42=102 */
/* Without banner: lang-bar top=0,  mob-topbar top=32, main pt=32+42=74     */
@media(max-width:760px){
  #sidebar{transform:translateX(-100%);transition:transform .24s}
  #sidebar.open{transform:translateX(0)}
  #lang-bar{padding:0 8px;height:32px;top:28px}
  #lang-bar.banner-hidden{top:0}
  #lang-bar .lang-label{display:none}
  #lang-bar .lang-btn{font-size:11px;padding:3px 7px}
  #main{margin-left:0;padding:10px 12px 80px;padding-top:102px}
  #main.banner-hidden{padding-top:74px}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .metric-grid{grid-template-columns:repeat(2,1fr)}
  #mob-bar{display:flex!important}
  #mob-topbar{display:flex!important;top:60px}
  .hero{padding:16px;border-radius:10px}
  .hero h1{font-size:18px!important}
  .sec-title{font-size:15px}
  .kpi-val{font-size:18px}
  .btn{white-space:normal;line-height:1.3}
}
@media(max-width:900px){
  .kpi-grid{grid-template-columns:1fr 1fr}
}
#mob-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;z-index:60;padding:4px 0 env(safe-area-inset-bottom,4px)}
#mob-topbar{display:none;position:fixed;top:64px;left:0;right:0;background:#fff;border-bottom:1px solid #e2e8f0;z-index:49;padding:8px 14px;align-items:center;justify-content:space-between;transition:top .15s}
/* desktop: banner(28)+lang-bar(36)=64 → without banner: lang-bar(36)=36 */
#mob-topbar.banner-hidden{top:36px}
/* mobile override comes after so it wins */
@media(max-width:760px){
  #mob-topbar.banner-hidden{top:32px}
}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45}
.mob-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;background:none;border:none;cursor:pointer;font-size:9px;font-weight:500;color:#94a3b8;min-width:0;overflow:hidden}
.mob-nav-btn.active{color:#0f172a}
.mob-nav-btn svg{flex-shrink:0}
.mob-nav-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;display:block}

/* ── Confirm dialog ── */
#confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
#confirm-overlay.show{display:flex}
#confirm-box{background:#fff;border-radius:14px;padding:24px;max-width:360px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.18)}

/* ── Large text mode ── */
html.text-large body{font-size:16px}
html.text-large .nav-btn{font-size:14.5px!important}
html.text-large .logo-name{font-size:15px!important}
html.text-large .logo-ver{font-size:11px!important}
html.text-large .sec-title{font-size:20px!important}
html.text-large .sec-sub{font-size:14.5px!important}
html.text-large .field-label{font-size:14.5px!important}
html.text-large .field-hint{font-size:12.5px!important}
html.text-large .field-val{font-size:15px!important}
html.text-large .kpi-label{font-size:12.5px!important}
html.text-large .kpi-val{font-size:26px!important}
html.text-large .kpi-sub{font-size:13px!important}
html.text-large .btn{font-size:15px!important}
html.text-large .btn-sm{font-size:14px!important}
html.text-large .badge{font-size:13px!important}
html.text-large table{font-size:14.5px!important}
html.text-large th{font-size:12px!important}
html.text-large td{font-size:14px!important}
html.text-large .card p,html.text-large .card div,html.text-large .card span{font-size:inherit}
html.text-large .resp-head{font-size:17px!important}
html.text-large .resp-body{font-size:15px!important}
html.text-large .resp-sug{font-size:14.5px!important}
html.text-large .factor-item{font-size:14px!important}
html.text-large .notif-item{font-size:14px}
html.text-large .disclaimer-box,html.text-large .sim-notice{font-size:13.5px!important}
html.text-large .metric-lbl{font-size:12.5px!important}
html.text-large .metric-num{font-size:27px!important}
html.text-large .act-btn{font-size:13.5px!important}

function catLabel(c){
  return {activity_analysis:t.hist.catActivity,scenario_run:t.hist.catScenario,qlearn_train:t.hist.catQLab}[c]||c;

function fmtDate(iso){
  if(!iso)return'—';
  try{const d=new Date(iso);return d.toLocaleDateString([],{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
  catch{return'—';}
}
function fmtRelative(iso){
  if(!iso)return'';
  try{
    const diff=Date.now()-new Date(iso).getTime();
    if(diff<60000)return lang==='hi'?'अभी':'just now';
    if(diff<3600000)return lang==='hi'?`${Math.floor(diff/60000)} मिनट पहले`:`${Math.floor(diff/60000)}m ago`;
    if(diff<86400000)return lang==='hi'?`${Math.floor(diff/3600000)} घंटे पहले`:`${Math.floor(diff/3600000)}h ago`;
    return fmtDate(iso);
  }catch{return'';}
}
async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  if(!r.ok)throw new Error(`API ${r.status}`);
  return r.json();
}
const pct=(v)=>Math.round((v||0)*100)+'%';
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

let _toastTimer;
function toast(msg,type='info'){
  const bc={success:'#22c55e',warning:'#f59e0b',error:'#ef4444',info:'#3b82f6'};
  const ic={success:'✓',warning:'!',error:'✗',info:'i'};
  const el=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  document.getElementById('toast-icon').textContent=ic[type]||'i';
  document.getElementById('toast-icon').style.color=bc[type];
  el.style.borderLeft=`3px solid ${bc[type]}`;
  el.classList.add('toast-show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(hideToast,4500);
}
function hideToast(){document.getElementById('toast').classList.remove('toast-show');}

function renderRiskDonut(counts){
  const total=(counts.low||0)+(counts.medium||0)+(counts.high||0)||1;
  const segs=[{v:counts.low||0,c:'#22c55e',l:t.dash.low},{v:counts.medium||0,c:'#f59e0b',l:t.dash.medium},{v:counts.high||0,c:'#ef4444',l:t.dash.high}];
  const r=38,cx=50,cy=50,sw=12,circ=2*Math.PI*r;
  let off=0;
  const arcs=segs.map(s=>{const dash=(s.v/total)*circ;const arc=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${sw}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-off}" style="transform-origin:${cx}px ${cy}px;transform:rotate(-90deg)"/>`;off+=dash;return arc;}).join('');
  const legend=segs.map(s=>`<div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:3px 0"><div style="display:flex;align-items:center;gap:6px"><div style="width:8px;height:8px;border-radius:50%;background:${s.c}"></div><span style="color:#64748b">${s.l}</span></div><span style="font-weight:700;color:#0f172a">${s.v}</span></div>`).join('');
  document.getElementById('risk-donut').innerHTML=`<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><div style="position:relative;flex-shrink:0"><svg width="100" height="100" viewBox="0 0 100 100">${arcs}<circle cx="${cx}" cy="${cy}" r="${r-sw/2-1}" fill="white"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-size:18px;font-weight:800;color:#0f172a">${(counts.low||0)+(counts.medium||0)+(counts.high||0)}</div><div style="font-size:9.5px;color:#94a3b8">total</div></div></div><div style="flex:1;min-width:80px">${legend}</div></div>`;
}

function setInt(v){actState.intensity=+v;const e=document.getElementById('int-val');if(e)e.textContent=v;updateTimeline();updateSummary();}
function setScenario(id,activity,dur,intensity){actState.scenario=id;actState.activity=activity;actState.duration=dur;actState.intensity=intensity;pageActivity();}
function resetActivity(){actState={activity:'sitting',duration:5,intensity:50,scenario:'normal',lastResult:null,lastAssistant:null};pageActivity();}
function updateTimeline(){
  const el=document.getElementById('act-timeline');if(!el)return;
  const colMap={walking:'#0d9488',sitting:'#3b82f6',lying_down:'#7c3aed',inactive:'#94a3b8'};
  const col=colMap[actState.activity]||'#94a3b8';
  const inactSlots=Math.min(22,Math.floor(actState.duration/5));
  el.innerHTML=Array.from({length:24},(_,i)=>{
    const isInact=(i>=(24-inactSlots-1))&&actState.activity==='inactive';
    if(isInact)return`<div class="tl-bar" style="height:5%;background:#ef444455;flex:1"></div>`;
    const jitter=Math.sin(i*2.1)*14+Math.cos(i*1.3)*9;
    const h=clamp(actState.intensity+jitter,5,98);
    return`<div class="tl-bar" style="height:${h}%;background:${col};opacity:${0.55+i/44};flex:1"></div>`;
  }).join('');
}
function updateSummary(){
  const el=document.getElementById('act-summary');if(!el)return;el.innerHTML='';
  const ta=t.act;
  [[ta.state,{walking:ta.walking,sitting:ta.sitting,lying_down:ta.lyingDown,inactive:ta.inactive}[actState.activity]||actState.activity,'#0f172a'],
   [ta.dur,`${actState.duration} ${ta.min}`,'#64748b'],[ta.int,`${actState.intensity}/100`,'#0d9488']
  ].forEach(([lbl,val,col])=>{const t=document.createElement('div');t.style.cssText='background:#f8fafc;border-radius:7px;padding:4px 10px;display:flex;align-items:center;gap:6px;font-size:11.5px';t.innerHTML=`<span style="color:#94a3b8">${lbl}:</span><span style="font-weight:700;color:${col}">${val}</span>`;el.appendChild(t);});
}
async function analyzeActivity(){
  const btn=document.getElementById('analyze-btn');const ta=t.act;
  if(btn){btn.disabled=true;btn.innerHTML=`${icon('loader',14,'#fff')} ${ta.analyzing}`;}
  const hour=new Date().getHours();
  try{
    const res=await api('/api/activity/analyze',{method:'POST',body:JSON.stringify({activity_state:actState.activity,inactivity_duration:actState.duration,movement_intensity:actState.intensity,scenario:actState.scenario||'normal',hour_of_day:hour})});
    actState.lastResult=res;modelReady=res.model_ready||modelReady;
    renderResult(res);

    actState.lastAssistant=asst;
    const rLbl=res.simulated_risk==='high'?ta.rHigh:res.simulated_risk==='medium'?ta.rMed:ta.rLow;

    buildNav();

function renderResult(res){

  const gc=res.simulated_risk==='high'?'glow-r':res.simulated_risk==='medium'?'glow-a':'glow-g';

}

function setRiskActivity(id){

    if(bid)b.classList.toggle('sel',bid===id);
  });
  const rdur=document.getElementById('rdur-val');if(rdur)rdur.textContent=actState.duration;
  const rint=document.getElementById('rint-val');if(rint)rint.textContent=actState.intensity;
}
function setRiskDur(v){actState.duration=+v;const e=document.getElementById('rdur-val');if(e)e.textContent=v;}
function setRiskInt(v){actState.intensity=+v;const e=document.getElementById('rint-val');if(e)e.textContent=v;}
async function runLivePredict(){

    const col=riskCol(res.prediction);const gc=res.prediction==='high'?'glow-r':res.prediction==='medium'?'glow-a':'glow-g';
    const pCols={low:'#22c55e',medium:'#f59e0b',high:'#ef4444'};const pLbls={low:ta.rLow,medium:ta.rMed,high:ta.rHigh};
    const rLbl=pLbls[res.prediction]||res.prediction;

  }catch(e){document.getElementById('live-result').innerHTML=`<div style="color:#ef4444;font-size:12px">Error: ${e.message}</div>`;}

function pageEmergency(){

    {id:'unusual_inactivity', label:te.unusual,    desc:te.unusualDesc,  risk:'medium',icon:'clock'},
    {id:'possible_fall',      label:te.fall,       desc:te.fallDesc,     risk:'high',  icon:'alert'},
    {id:'high_risk_demo',     label:te.highRisk,   desc:te.highRiskDesc, risk:'high',  icon:'zap'},
  ];
  document.getElementById('page-area').innerHTML=`<div class="page-in">
    <div class="sec-hdr"><div class="sec-icon" style="background:linear-gradient(135deg,#dc2626,#ef4444)">${icon('alert',18,'#fff')}</div><div><div class="sec-title">${te.title}</div><div class="sec-sub">${te.subtitle}</div></div></div>
    <div class="disclaimer-box" style="margin-bottom:16px;display:flex;align-items:flex-start;gap:8px">${icon('alert',14,'#92400e')} <span>${te.simDisclaimer}</span></div>
    <div class="grid2" style="margin-bottom:14px">
      <div class="flex-col">
        <div class="card">
          <div class="field-label" style="margin-bottom:10px">${te.selectScenario}</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            ${scenarios.map(s=>{
              const bgMap={low:'#dcfce7',medium:'#fef3c7',high:'#fee2e2'};
              const selCls=emergState.selectedId===s.id?` sel-${s.risk==='medium'?'med':s.risk}`:'';
              return`<div class="sc-card${selCls}" onclick="selectScenario('${s.id}')">
                <div style="width:34px;height:34px;min-width:34px;border-radius:8px;background:${bgMap[s.risk]};display:flex;align-items:center;justify-content:center">${icon(s.icon,16,riskCol(s.risk))}</div>
                <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px;color:#0f172a;margin-bottom:2px">${s.label}</div><div style="font-size:11.5px;color:#64748b">${s.desc}</div></div>
                <span class="badge badge-${s.risk}" style="font-size:9.5px;flex-shrink:0">${riskLabelShort(s.risk)}</span>
              </div>`;
            }).join('')}

            <button class="btn btn-primary" id="run-btn" onclick="runScenario()" ${!emergState.selectedId||emergState.running?'disabled':''} style="flex:1;justify-content:center">

          </div>
        </div>
      </div>
      <div class="flex-col">
        <div class="card" id="emerg-result">
          ${emergState.result?renderEmergResult(emergState.result):`<div style="padding:24px 0;text-align:center"><div style="opacity:.25;margin-bottom:10px">${icon('alert',36,'#94a3b8')}</div><div style="font-size:13px;color:#94a3b8;line-height:1.6">${te.noResult}</div></div>`}
        </div>
      </div>

    ${emergState.result?`<div class="card" style="margin-top:0"><div style="font-weight:700;font-size:13px;color:#0f172a;margin-bottom:12px;display:flex;align-items:center;gap:7px">${icon('cpu',15,'#7c3aed')} ${te.response}</div><div id="emerg-response">${renderEmergResponse(emergState.result)}</div></div>`:''}
  </div>`;
}
function riskLabelShort(r){return r==='high'?t.dash.high:r==='medium'?t.dash.medium:t.dash.low;}
function selectScenario(id){emergState.selectedId=id;pageEmergency();}
function resetEmergency(){emergState={selectedId:null,running:false,result:null};pageEmergency();}
function renderEmergResult(res){
  const te=t.emerg;const col=riskCol(res.simulated_risk);const gc=res.simulated_risk==='high'?'glow-r':res.simulated_risk==='medium'?'glow-a':'glow-g';
  const rLabel=riskLabelShort(res.simulated_risk);
  const pCols={low:'#22c55e',medium:'#f59e0b',high:'#ef4444'};const pLbls={low:t.act.rLow,medium:t.act.rMed,high:t.act.rHigh};
  const warning=res.warning?`<div style="display:flex;align-items:flex-start;gap:7px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:11.5px;color:#92400e">${icon('alert',13,'#d97706')} <span>${res.warning}</span></div>`:'';
  const steps=(res.steps||[]).map((s,i)=>`<div class="step-row step-in" style="animation-delay:${i*0.1}s"><div class="step-num done">${i+1}</div><span style="font-size:12.5px;color:#334155">${s}</span></div>`).join('');
  const probBars=res.probabilities&&Object.keys(res.probabilities).length>0?`<div style="margin-top:12px;padding-top:10px;border-top:1px solid #f1f5f9">${['low','medium','high'].map(cls=>{const pv=res.probabilities[cls]||0;return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11.5px"><span style="width:68px;color:#64748b;flex-shrink:0">${pLbls[cls]}</span><div class="prob-bar-track"><div class="prob-bar-fill" style="width:${pct(pv)};background:${pCols[cls]}"></div></div><span style="width:36px;text-align:right;font-weight:700;color:${pCols[cls]}">${Math.round(pv*100)}%</span></div>`;}).join('')}</div>`:''
  return`
    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:9px;background:${col}0d;border:2px solid ${col}33;margin-bottom:14px">
      <div class="${gc}" style="width:42px;height:42px;min-width:42px;border-radius:50%;background:${col}22;border:2px solid ${col}44;display:flex;align-items:center;justify-content:center">${icon(res.simulated_risk==='high'?'alert':res.simulated_risk==='medium'?'clock':'check',21,col)}</div>
      <div style="flex:1"><div style="font-size:17px;font-weight:800;color:${col};margin-bottom:2px">${rLabel}</div><div style="font-size:11px;color:#94a3b8">${res.prediction_source==='ml_model'?`ML model`:'Heuristic'} · ${fmtRelative(res.timestamp)}</div></div>
      ${probBars}
    </div>
    ${warning}
    <div style="font-weight:700;font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">${te.steps}</div>
    ${steps}
    <div class="sim-notice" style="margin-top:12px">${icon('check',13,'#16a34a')} ${te.simDisclaimer}</div>`;
}
function renderEmergResponse(res){
  if(!res.assistant_response)return'';
  const asst=res.assistant_response;const col=riskCol(asst.risk_level);
  return`<div style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:9px;background:${col}08;border:1.5px solid ${col}22;margin-bottom:12px"><div style="flex:1"><div style="font-size:14px;font-weight:700;color:${col};margin-bottom:6px">${asst.headline}</div><div style="font-size:12.5px;color:#334155;line-height:1.6;margin-bottom:10px">${asst.explanation}</div><div class="resp-sug" style="font-size:12px">${asst.suggestion}</div></div></div><div class="disclaimer-box">${asst.disclaimer}</div>`;
}
async function runScenario(){
  if(!emergState.selectedId||emergState.running)return;
  emergState.running=true;pageEmergency();
  try{
    const res=await api('/api/scenarios/run',{method:'POST',body:JSON.stringify({scenario_id:emergState.selectedId,lang})});
    emergState.result=res;emergState.running=false;
    actState.lastResult={simulated_risk:res.simulated_risk,activity_state:res.scenario.activity_state,inactivity_duration:res.scenario.inactivity_duration,movement_intensity:res.scenario.movement_intensity,probabilities:res.probabilities,prediction_source:res.prediction_source,hour_of_day:new Date().getHours(),timestamp:res.timestamp};
    actState.lastAssistant=res.assistant_response;
    const notifData=await api('/api/notifications');
    unreadCount=notifData.unread||0;buildNav();
    pageEmergency();
    toast(lang==='hi'?`परिदृश्य पूर्ण: ${riskLabelShort(res.simulated_risk)}`:`Scenario complete: ${riskLabelShort(res.simulated_risk)}`,res.simulated_risk==='high'?'warning':'success');
  }catch(e){emergState.running=false;pageEmergency();toast('Error running scenario','error');}
}

        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">${icon('zap',15,'#0d9488')}<span style="font-weight:700;font-size:13px;color:#0f172a">${tl.actions}</span></div>
        <div style="font-size:12px;color:#64748b;margin-bottom:10px">${tl.actionDesc}</div>
        <div id="action-list" style="display:flex;flex-direction:column;gap:5px"><div style="color:#94a3b8;font-size:11.5px">Loading…</div></div>
      </div>
      <div class="card" style="border-top:3px solid #f59e0b">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">${icon('award',15,'#f59e0b')}<span style="font-weight:700;font-size:13px;color:#0f172a">${tl.rewards}</span></div>
        <div style="font-size:12px;color:#64748b;margin-bottom:10px">${tl.rewardDesc}</div>
        <div style="font-size:12px;color:#334155;line-height:1.7">
          <div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f1f5f9"><span>${lang==='hi'?'सही कार्रवाई (सामान्य)':'Correct action (normal)'}</span><span style="font-weight:700;color:#22c55e">+1.0</span></div>
          <div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f1f5f9"><span>${lang==='hi'?'सही कार्रवाई (उच्च जोखिम)':'Correct action (high risk)'}</span><span style="font-weight:700;color:#22c55e">+2.0</span></div>
          <div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f1f5f9"><span>${lang==='hi'?'निकट कार्रवाई':'Near-correct action'}</span><span style="font-weight:700;color:#f59e0b">-0.5</span></div>
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span>${lang==='hi'?'गलत कार्रवाई':'Wrong action'}</span><span style="font-weight:700;color:#ef4444">-1.0</span></div>
        </div>
      </div>
    </div>

    <!-- Train controls -->
    <div class="card" style="margin-bottom:14px">
      <div style="font-weight:700;font-size:13px;color:#0f172a;margin-bottom:12px;display:flex;align-items:center;gap:7px">${icon('target',15,'#7c3aed')} ${lang==='hi'?'प्रशिक्षण नियंत्रण':'Training Controls'}</div>
      <div style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap">
        <div>
          <div class="field-label" style="margin-bottom:6px">${tl.episodes}</div>
          <div style="display:flex;gap:6px">
            ${[100,500,1000,2000].map(n=>`<button onclick="labState.episodes=${n};document.querySelectorAll('.ep-btn').forEach(b=>b.classList.toggle('sel',b.textContent=='${n}'))" class="act-btn ep-btn${labState.episodes===n?' sel':''}" style="min-width:50px;padding:6px 10px;font-size:12px">${n}</button>`).join('')}
          </div>
        </div>
        <div>
          <div class="field-label" style="margin-bottom:6px">${tl.seed}</div>
          <input type="number" id="lab-seed" value="${labState.seed}" min="1" max="9999" style="border:1.5px solid #e2e8f0;border-radius:7px;padding:6px 10px;font-size:12.5px;width:80px;color:#334155" oninput="labState.seed=+this.value||42"/>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" id="train-btn" onclick="trainAgent()">${icon('play',14,'#fff')} ${tl.train}</button>
          ${labState.trained?`<button class="btn btn-outline" onclick="resetLab()">${icon('refresh',14)} ${tl.reset}</button>`:''}
        </div>
      </div>
      ${labState.trained&&labState.data?`<div class="sim-notice" style="margin-top:12px">${icon('check',13,'#16a34a')} ${tl.trained} · ${tl.finalReward}: <strong>${labState.data.final_avg_reward}</strong> · ${tl.episodes}: ${labState.data.episodes} · ${tl.seed}: ${labState.data.seed}</div>`:''}
    </div>

    <!-- Results (shown after training) -->
    <div id="lab-results">${labState.trained&&labState.data?renderLabResults():`<div style="text-align:center;padding:32px 0;color:#94a3b8;font-size:13px">${tl.notTrained}</div>`}</div>
  </div>`;
  loadLabInfo();
}
async function loadLabInfo(){
  try{
    const info=await api('/api/qlearn/info');
    const states=info.states||[];const actions=info.actions||[];
    const sl=document.getElementById('state-list');const al=document.getElementById('action-list');
    if(sl)sl.innerHTML=states.map(s=>`<div style="display:flex;align-items:center;justify-content:space-between;font-size:11.5px;padding:2px 0"><span style="color:#334155">${lang==='hi'?s.name_hi:s.name_en}</span><span class="badge badge-${s.risk}" style="font-size:9px">${riskLabelShort(s.risk)}</span></div>`).join('');
    if(al)al.innerHTML=actions.map((a,i)=>`<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;padding:2px 0"><div style="width:18px;height:18px;min-width:18px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#475569">${i}</div><span style="color:#334155">${lang==='hi'?a.name_hi:a.name_en}</span></div>`).join('');
  }catch(e){}
}
async function trainAgent(){
  const btn=document.getElementById('train-btn');const tl=t.lab;
  if(btn){btn.disabled=true;btn.innerHTML=`${icon('loader',14,'#fff')} ${tl.training}`;}
  try{
    const data=await api('/api/qlearn/train',{method:'POST',body:JSON.stringify({episodes:labState.episodes,seed:labState.seed})});
    labState.trained=true;labState.data=data;
    pageLab();toast(lang==='hi'?`एजेंट प्रशिक्षित! औसत पुरस्कार: ${data.final_avg_reward}`:`Agent trained! Avg reward: ${data.final_avg_reward}`,'success');
  }catch(e){toast('Training error: '+e.message,'error');}
  if(btn){btn.disabled=false;btn.innerHTML=`${icon('play',14,'#fff')} ${tl.train}`;}
}
function resetLab(){labState={trained:false,data:null,episodes:500,seed:42};pageLab();}
function renderLabResults(){
  if(!labState.data)return'';
  const tl=t.lab;const data=labState.data;
  const states=data.states||[];const actions=data.actions||[];const Q=data.q_table||[];const best=data.best_actions||[];
  const rewardHist=data.reward_history||[];
  // Reward chart
  const maxR=Math.max(...rewardHist.map(r=>r.reward),0.1);
  const minR=Math.min(...rewardHist.map(r=>r.reward),0);
  const range=maxR-minR||1;
  const chartBars=rewardHist.map(r=>{const h=Math.max(2,Math.round(((r.reward-minR)/range)*100));return`<div class="reward-bar" style="height:${h}%;background:linear-gradient(to top,#0f172a88,#3b82f6aa)" title="Ep ${r.episode}: ${r.reward}"></div>`;}).join('');
  // Q-table
  const qTableRows=states.map((s,si)=>{
    const bestIdx=best[si]??0;const sName=lang==='hi'?s.name_hi:s.name_en;
    return`<tr><td class="state-cell">${sName}</td><td class="badge-cell"><span class="badge badge-${s.risk}" style="font-size:9px">${riskLabelShort(s.risk)}</span></td>${Q[si]?.map((v,ai)=>`<td class="${ai===bestIdx?'best-action':''}" title="${(lang==='hi'?actions[ai]?.name_hi:actions[ai]?.name_en)||ai}">${v.toFixed(2)}</td>`).join('')||''}<td style="font-weight:700;color:#0f172a;font-size:12px">${lang==='hi'?actions[bestIdx]?.name_hi:actions[bestIdx]?.name_en}</td></tr>`;
  }).join('');
  // Agent demo dropdown
  const demoDrop=`<select id="demo-state" onchange="updateAgentDemo()" style="margin-right:10px">${states.map((s,i)=>`<option value="${i}">${lang==='hi'?s.name_hi:s.name_en}</option>`).join('')}</select>`;
  return`
    <div class="grid2" style="margin-bottom:14px">
      <div class="card">
        <div style="font-weight:700;font-size:13px;color:#0f172a;margin-bottom:10px;display:flex;align-items:center;gap:7px">${icon('trending',15,'#3b82f6')} ${tl.rewardChart}</div>
        <div class="reward-chart" style="margin-bottom:6px">${chartBars}</div>
        <div style="display:flex;justify-content:space-between;font-size:9.5px;color:#94a3b8">
          <span>Ep 1</span><span>Ep ${Math.round(data.episodes/2)}</span><span>Ep ${data.episodes}</span>
        </div>
        <div style="margin-top:8px"><div style="font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">${tl.hyperparams}</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px">${[['α ('+tl.alpha+')',data.hyperparams?.alpha],['γ ('+tl.gamma+')',data.hyperparams?.gamma],['ε','1.0→0.05']].map(([k,v])=>`<span class="badge badge-blue" style="font-size:10px">${k}: ${v}</span>`).join('')}</div>
        </div>
      </div>
      <div class="card">
        <div style="font-weight:700;font-size:13px;color:#0f172a;margin-bottom:10px;display:flex;align-items:center;gap:7px">${icon('target',15,'#7c3aed')} ${tl.agentDemo}</div>
        <div style="font-size:12px;color:#64748b;margin-bottom:10px">${tl.selectState}:</div>
        ${demoDrop}
        <div id="demo-result" style="margin-top:12px"></div>
      </div>
    </div>
    <div class="card">
      <div style="font-weight:700;font-size:13px;color:#0f172a;margin-bottom:10px;display:flex;align-items:center;gap:7px">${icon('book',15,'#0d9488')} ${tl.qTable}</div>
      <div style="overflow-x:auto"><table class="qtable"><thead><tr><th style="text-align:left">${tl.stateLabel}</th><th>${tl.riskLabel}</th>${actions.map(a=>`<th>${lang==='hi'?a.name_hi:a.name_en}</th>`).join('')}<th>${tl.learnedLabel}</th></tr></thead><tbody>${qTableRows}</tbody></table></div>
      <div style="font-size:10.5px;color:#94a3b8;margin-top:8px">${lang==='hi'?'हरे रंग = प्रत्येक अवस्था के लिए सर्वोत्तम कार्रवाई':'Green cells = best action selected by the agent for each state'}</div>
    </div>`;
}
function updateAgentDemo(){
  const sel=document.getElementById('demo-state');if(!sel||!labState.data)return;
  const si=+sel.value;const data=labState.data;const tl=t.lab;
  const states=data.states||[];const actions=data.actions||[];const best=data.best_actions||[];
  const s=states[si];const bestIdx=best[si]??0;const bestAction=actions[bestIdx];
  const actionName=lang==='hi'?bestAction?.name_hi:bestAction?.name_en;
  const col=riskCol(s?.risk||'low');const idealIdx=s?.ideal_action??0;const isCorrect=bestIdx===idealIdx;
  document.getElementById('demo-result').innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:9px;background:${col}0d;border:2px solid ${col}33">
      <div style="flex:1">
        <div style="font-size:11px;color:#64748b;margin-bottom:4px">${tl.bestAction}</div>
        <div style="font-size:15px;font-weight:800;color:${col}">${actionName}</div>
        <div style="font-size:11px;color:#94a3b8;margin-top:3px">${lang==='hi'?'अवस्था:':'State:'} ${lang==='hi'?s?.name_hi:s?.name_en} · <span class="badge badge-${s?.risk||'low'}" style="font-size:9px;vertical-align:middle">${riskLabelShort(s?.risk||'low')}</span></div>
      </div>
      ${isCorrect?`<span class="badge badge-low" style="font-size:10px">${tl.correctLabel}</span>`:`<span class="badge badge-gray" style="font-size:10px">${lang==='hi'?'अनुकूलनशील':'Learning'}</span>`}
    </div>`;
}

// ═══════════════════════════════════════════════════════════
// PAGE: ABOUT & SETTINGS
// ═══════════════════════════════════════════════════════════
function pageAbout(){
  const ta=t.about;
  const tech=[
    {n:'FastAPI (Python)',    d:'REST API backend',            c:'#16a34a'},
    {n:'Pure-Python RF',      d:'No-scipy Random Forest',      c:'#7c3aed'},
    {n:'NumPy',               d:'Array math for ML',           c:'#3b82f6'},
    {n:'Q-Learning',          d:'Educational RL simulation',   c:'#f59e0b'},
    {n:'Vanilla JS',          d:'Frontend (no build step)',     c:'#0d9488'},
    {n:'Inline CSS',          d:'Design system',               c:'#475569'},
  ];
  document.getElementById('page-area').innerHTML=`<div class="page-in" style="max-width:680px;margin:0 auto">
    <div class="sec-hdr"><div class="sec-icon" style="background:linear-gradient(135deg,#334155,#475569)">${icon('settings',18,'#fff')}</div><div><div class="sec-title">${ta.title}</div><div class="sec-sub">${ta.subtitle}</div></div></div>
    <div class="card" style="margin-bottom:13px">
      <div class="flex-row" style="margin-bottom:11px">${icon('globe',15,'#3b82f6')} <span style="font-weight:700;font-size:13px;color:#0f172a">${ta.langLabel}</span></div>
      <div style="display:flex;gap:9px">
        ${['en','hi'].map(lc=>`<button onclick="setLang('${lc}')" style="flex:1;padding:11px;border:2px solid ${lang===lc?'#0f172a':'#e2e8f0'};border-radius:9px;cursor:pointer;background:${lang===lc?'#0f172a':'#fff'};color:${lang===lc?'#fff':'#334155'};font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s">${lc==='en'?'🇬🇧':'🇮🇳'} ${lc==='en'?ta.english:ta.hindi}${lang===lc?` ${icon('check',13,'#7dd3fc')}`:''}</button>`).join('')}
      </div>
    </div>
    <div class="card" style="margin-bottom:13px">
      <div class="flex-row" style="margin-bottom:10px">${icon('sun',15,'#f59e0b')} <span style="font-weight:700;font-size:13px;color:#0f172a">${ta.textSize}</span></div>
      <div style="display:flex;gap:7px">
        <button class="btn ${!textLarge?'btn-primary':'btn-outline'} btn-sm" onclick="setTextSize(false)">${ta.normal}</button>
        <button class="btn ${textLarge?'btn-primary':'btn-outline'} btn-sm" onclick="setTextSize(true)">${ta.large}</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:13px">
      <div class="flex-row" style="margin-bottom:10px">${icon('heart',15,'#ef4444')} <span style="font-weight:700;font-size:13px;color:#0f172a">${ta.aboutTitle}</span></div>
      <p style="font-size:13px;color:#334155;line-height:1.7">${ta.aboutDesc}</p>
      <div style="display:flex;gap:7px;margin-top:11px;flex-wrap:wrap">
        <span class="badge badge-blue">${ta.course}</span>
        <span class="badge badge-gray">${ta.version} 3.0.0</span>
        <span class="badge badge-gray">Prompt 3 of 3 ✓</span>
        ${modelReady?`<span class="badge badge-model">${icon('zap',9,'#5b21b6',2)} ML Ready</span>`:''}
      </div>
    </div>
    <div class="card" style="margin-bottom:13px">
      <div class="flex-row" style="margin-bottom:10px">${icon('layers',15,'#7c3aed')} <span style="font-weight:700;font-size:13px;color:#0f172a">${ta.techTitle}</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px">${tech.map(item=>`<div style="background:#f8fafc;border-radius:8px;padding:8px 11px;display:flex;align-items:center;gap:9px"><div style="width:8px;height:8px;border-radius:50%;background:${item.c};flex-shrink:0"></div><div><div style="font-size:12.5px;font-weight:700;color:#0f172a">${item.n}</div><div style="font-size:10.5px;color:#94a3b8">${item.d}</div></div></div>`).join('')}</div>
    </div>
    <div class="card" style="border-left:3px solid #f59e0b">
      <div class="flex-row" style="margin-bottom:10px">${icon('alert',15,'#f59e0b')} <span style="font-weight:700;font-size:13px;color:#0f172a">${ta.limTitle}</span></div>
      ${ta.lims.map(l=>`<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:7px;font-size:13px;color:#334155;line-height:1.6"><span style="color:#f59e0b;flex-shrink:0;margin-top:2px">•</span><span>${l}</span></div>`).join('')}
    </div>
  </div>`;
}
function setTextSize(large){
  textLarge=large;
  document.documentElement.classList.toggle('text-large',large);
  document.documentElement.style.fontSize='';
  localStorage.setItem('lg_textLarge',large?'1':'0');
  pageAbout();
}

// ═══════════════════════════════════════════════════════════
// LANGUAGE
// ═══════════════════════════════════════════════════════════
function setLang(l){
  lang=l;t=T[l]||T.en;
  document.documentElement.lang=l;
  document.body.classList.toggle('lang-hi',l==='hi');
  sessionStorage.setItem('lg_lang',l);
  actState.lastAssistant=null;
  render();
}

// ═══════════════════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════════════════
function render(){
  buildNav();
  switch(page){
    case 'dashboard':      pageDashboard();   break;
    case 'activity':       pageActivity();    break;
    case 'risk':           pageRisk();        break;
    case 'ai':             pageAI();          break;
    case 'emergency':      pageEmergency();   break;
    case 'notifications':  pageNotifications();break;
    case 'history':        pageHistory();     break;
    case 'lab':            pageLab();         break;
    case 'about':          pageAbout();       break;
    default:               pageDashboard();
  }
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
function closeBanner(){
  document.getElementById('proto-banner').classList.add('hidden');
  ['#lang-bar','#app','#sidebar','#mob-topbar','#main'].forEach(s=>{
    const el=document.querySelector(s);if(el)el.classList.add('banner-hidden');
  });
  sessionStorage.setItem('bannerDismissed','1');
}

document.addEventListener('DOMContentLoaded',()=>{
  // Restore language from session
  const savedLang=sessionStorage.getItem('lg_lang');
  if(savedLang&&T[savedLang]){lang=savedLang;t=T[savedLang];document.documentElement.lang=savedLang;document.body.classList.toggle('lang-hi',savedLang==='hi');}
  // Restore text size from localStorage
  const savedSize=localStorage.getItem('lg_textLarge');
  if(savedSize==='1'){textLarge=true;document.documentElement.classList.add('text-large');}
  if(sessionStorage.getItem('bannerDismissed')==='1') closeBanner();
  fetch('/api/health').then(r=>r.json()).then(d=>{
    modelReady=d.model_ready||false;
    return fetch('/api/notifications').then(r=>r.json()).then(n=>{unreadCount=n.unread||0;});
  }).catch(()=>{}).finally(()=>render());
});
</script>
